site_name: "COMP0016 Systems Engineering – Team 25"
site_description: "Carbon-Aware AI Workload Scheduler – Final Report"
site_url: "https://students.cs.ucl.ac.uk/2025/group25/"
repo_url: "https://github.com/akioweh/carbon-aware-ai-agents"
repo_name: "Carbon-Aware AI Agents"

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font: false
  custom_dir: docs/overrides
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - toc.integrate
    - content.tabs.link

markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
  - pymdownx.blocks.caption:
      types:
        - name: caption
          prefix: "Figure {}."
        - name: table
          prefix: "Table {}."
  - pymdownx.blocks.admonition

plugins:
  - offline
  - search
  - mkdocs-video:
      css_style:
        position: relative
        width: "100%"
        aspect-ratio: "16/9"

extra:
  polyfills:
    - assets/vendor/iframe-worker/shim.js

extra_javascript:
  - assets/vendor/katex/katex.min.js
  - assets/vendor/katex/contrib/auto-render.min.js
  - assets/vendor/mermaid/mermaid.min.js
  - javascripts/katex.js
  - javascripts/mermaid.js

extra_css:
  - stylesheets/extra.css
  - assets/vendor/katex/katex.min.css

nav:
  - Home: index.md
  - Requirements: requirements.md
  - Research: research.md
  - Algorithms: algorithms.md
  - UI Design: ui-design.md
  - System Design: system-design.md
  - Implementation: implementation.md
  - Testing: testing.md
  - Evaluation: evaluation.md
  - Possible Extensions: possible-extensions.md
  - AI Research Journal: dev-journal.md
  - Appendices: appendices.md
