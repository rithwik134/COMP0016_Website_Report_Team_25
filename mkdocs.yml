site_name: "COMP0016 Systems Engineering – Team 25"
site_description: "Carbon-Aware AI Workload Scheduler – Final Report"
site_url: "https://students.cs.ucl.ac.uk/2025/group25/"

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font: false
  custom_dir: docs/overrides
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - toc.integrate
    - content.tabs.link

markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.snippets:
      base_path: ["."]
  - pymdownx.blocks.caption:
      types:
        - name: caption
          prefix: "Figure {}."
        - name: table
          prefix: "Table {}."
  - pymdownx.blocks.admonition

plugins:
  - search

extra_javascript:
  - javascripts/katex.js
  - https://unpkg.com/katex@0.16.7/dist/katex.min.js
  - https://unpkg.com/katex@0.16.7/dist/contrib/auto-render.min.js

extra_css:
  - stylesheets/extra.css
  - https://unpkg.com/katex@0.16.7/dist/katex.min.css

nav:
  - Home: index.md
  - Requirements: requirements.md
  - Research: research.md
  - Algorithms: algorithms.md
  - UI Design: ui-design.md
  - System Design: system-design.md
  - Implementation: implementation.md
  - Testing: testing.md
  - Evaluation: evaluation.md
  - Appendices: appendices.md
